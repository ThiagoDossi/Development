<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Caridade e Esperança — Painel de Organização</title>

<!-- ===================== FIREBASE (SDK "compat") ===================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --mata:#1b4332;
    --mata-light:#2d6a4f;
    --mar:#0d1b2a;
    --mar-light:#1b3a4b;
    --dourado:#d4af37;
    --areia:#f4ecd8;
    --branco:#fffaf0;
    --texto:#22333b;
    --alerta:#e85d04;
  }
  *{box-sizing:border-box;}
  body{
    font-family: Georgia, 'Segoe UI', serif;
    background: linear-gradient(180deg,var(--areia) 0%, #e8ddc0 100%);
    color:var(--texto);
    margin:0;
    min-height:100vh;
  }
  .hidden{display:none !important;}
  button{
    cursor:pointer;
    font-family:inherit;
    border:none;
    border-radius:6px;
    padding:.5rem .9rem;
    font-size:.9rem;
  }
  .btn-primary{ background:var(--mata); color:var(--branco); }
  .btn-primary:hover{ background:var(--mata-light); }
  .btn-secondary{ background:#ddd3b8; color:var(--texto); }
  .btn-logout{ background:var(--dourado); color:var(--mar); font-weight:bold; }

  /* ---------- LOGIN / CARREGANDO ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at top, var(--mar-light), var(--mar) 70%);
  }
  .login-box{
    background:var(--branco);
    border:3px solid var(--dourado);
    border-radius:14px;
    padding:2rem 2.5rem;
    max-width:380px;
    width:90%;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    text-align:center;
  }
  .login-emblem{ font-size:1.6rem; margin-bottom:.5rem; letter-spacing:.3rem; }
  .login-box h1{ font-size:1.25rem; color:var(--mata); margin-bottom:.2rem; }
  .login-box .login-subtitle{ font-size:.85rem; color:#777; font-style:italic; margin-bottom:1.2rem; }
  .auth-tabs{ display:flex; border:1px solid #ddd; border-radius:8px; overflow:hidden; margin-bottom:1.2rem; }
  .auth-tab{ flex:1; background:#eee3c4; color:var(--texto); border-radius:0; font-weight:bold; padding:.6rem; }
  .auth-tab.active{ background:var(--mata); color:var(--branco); }
  .auth-form{ display:flex; flex-direction:column; gap:.9rem; text-align:left; }
  .login-box label{ font-size:.85rem; font-weight:bold; display:flex; flex-direction:column; gap:.3rem; }
  input, textarea{
    font-family:inherit;
    padding:.5rem;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:.9rem;
  }
  .error{ color:#a4161a; font-size:.8rem; margin-top:.8rem; }

  /* ---------- APP LAYOUT ---------- */
  .topbar{
    background: linear-gradient(120deg,var(--mata) 0%, var(--mar) 100%);
    color:var(--branco);
    padding:.9rem 1.4rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:4px solid var(--dourado);
    flex-wrap:wrap;
    gap:.5rem;
  }
  .brand{ font-weight:bold; letter-spacing:.03rem; }
  .brand small{ display:block; font-weight:normal; font-size:.75rem; opacity:.85; letter-spacing:0; }
  .session-info{ display:flex; align-items:center; gap:.7rem; font-size:.85rem; }
  .notif-bell{ background:none; color:var(--branco); font-size:1.15rem; padding:.3rem .5rem; position:relative; }
  .notif-badge{ position:absolute; top:-2px; right:-2px; background:var(--alerta); color:var(--branco); border-radius:50%; font-size:.62rem; padding:1px 5px; font-weight:bold; line-height:1.3; }
  .notif-dropdown{ position:absolute; right:0; top:calc(100% + 8px); background:var(--branco); border:2px solid var(--dourado); border-radius:10px; width:300px; max-height:380px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:60; color:var(--texto); }
  .notif-item{ padding:.55rem .7rem; border-bottom:1px solid #eee; font-size:.85rem; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item-title{ font-weight:bold; color:var(--mata); }
  .notif-empty{ padding:1rem; text-align:center; color:#777; font-style:italic; font-size:.85rem; }
  .app-body{ display:flex; min-height:calc(100vh - 60px); }
  .sidebar{
    width:250px;
    background:var(--mata);
    color:var(--areia);
    padding:1rem 0;
    flex-shrink:0;
  }
  .content{ flex:1; padding:1.5rem 2rem; }
  ul.nav-root, ul.nav-children{ list-style:none; margin:0; padding:0; }
  ul.nav-children{ padding-left:1rem; }
  .nav-parent, .nav-link{
    display:flex; align-items:center; gap:.4rem;
    width:100%; text-align:left;
    background:none; color:var(--areia);
    padding:.55rem 1rem; font-size:.88rem; border-radius:0;
  }
  .nav-parent{ cursor:pointer; justify-content:space-between; }
  .nav-parent:hover, .nav-link:hover{ background:rgba(255,255,255,.08); }
  .nav-link.active{ background:var(--dourado); color:var(--mar); font-weight:bold; }
  .chevron{ transition:transform .15s; }
  .chevron.open{ transform:rotate(90deg); }

  .view-header h2{ color:var(--mata); border-bottom:2px solid var(--dourado); padding-bottom:.4rem; }
  .hint{ color:#777; font-style:italic; }

  /* ---------- CALENDAR ---------- */
  .cal-controls{ display:flex; align-items:center; gap:1rem; margin:1rem 0; }
  .cal-legend{ display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:.6rem; font-size:.8rem; }
  .cal-legend span{ display:inline-flex; align-items:center; gap:.35rem; }
  .legend-swatch{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .legend-dot{ width:12px; height:12px; border-radius:50%; display:inline-block; background:var(--alerta); box-shadow:0 0 0 3px rgba(232,93,4,.25); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:.3rem; }
  .cal-weekdays div{ text-align:center; font-weight:bold; color:var(--mar); font-size:.8rem; }
  .cal-cell{
    background:var(--branco); border:1px solid #ddd; border-radius:6px;
    min-height:82px; padding:.3rem; cursor:pointer; position:relative;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .cal-cell.empty{ background:transparent; border:none; cursor:default; }
  .cal-cell:hover{ border-color:var(--dourado); }
  .cal-cell.selected{ border:2px solid var(--mata); }
  .cal-cell.today .cal-day-num{ color:var(--dourado); font-weight:bold; }
  .cal-day-num{ font-size:.8rem; }
  .cal-item-list{ display:flex; flex-direction:column; gap:2px; margin-top:3px; }
  .cal-chip{
    font-size:.65rem; line-height:1.2; padding:2px 5px; border-radius:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:bold;
  }
  .cal-chip.chip-event{ background:var(--mata); color:var(--branco); }
  .cal-chip-more{ font-size:.62rem; color:#555; font-style:italic; margin-top:1px; }
  .cal-task-dots{ display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  .cal-task-dot{
    width:11px; height:11px; border-radius:50%; background:var(--alerta);
    box-shadow:0 0 0 3px rgba(232,93,4,.22); cursor:help; flex-shrink:0;
  }
  .cal-events-panel{ margin-top:1.2rem; }

  /* ---------- CARDS / TABLE ---------- */
  .card-list{ display:flex; flex-direction:column; gap:.8rem; margin:1rem 0; }
  .card{ background:var(--branco); border:1px solid #ddd; border-left:4px solid var(--mata); border-radius:8px; padding:.9rem 1.1rem; }
  .card-header{ display:flex; justify-content:space-between; align-items:center; }
  .card-actions button{ background:none; padding:.2rem .4rem; }
  .volunteers{ font-size:.9rem; }
  .badge-help{ display:inline-block; background:#fff3cd; color:#8a5a00; border:1px solid #d4af37; border-radius:20px; padding:.2rem .7rem; font-size:.8rem; margin-top:.3rem; }
  .badge-date{ display:inline-block; background:#e7f3ec; color:var(--mata); border:1px solid var(--mata); border-radius:20px; padding:.2rem .7rem; font-size:.8rem; margin-top:.3rem; }
  .task-actions{ margin-top:.6rem; display:flex; gap:.5rem; flex-wrap:wrap; }
  .task-actions button{ background:var(--mar-light); color:var(--branco); font-size:.8rem; }

  table.data-table{ width:100%; border-collapse:collapse; margin-top:1rem; background:var(--branco); }
  table.data-table th, table.data-table td{ border:1px solid #ddd; padding:.55rem .7rem; text-align:left; font-size:.9rem; }
  table.data-table th{ background:var(--mata); color:var(--branco); }
  .table-actions button{ background:none; padding:.1rem .3rem; }

  /* ---------- PACIENTES / FICHA DE CURA ---------- */
  .patient-search{ width:100%; max-width:400px; margin-bottom:1rem; display:block; }
  .patient-summary-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:.6rem 1.2rem; margin:.6rem 0;
  }
  .patient-field-label{ font-size:.72rem; color:#777; text-transform:uppercase; letter-spacing:.03rem; }
  .back-link{ background:none; color:var(--mata); font-weight:bold; padding:.3rem 0; margin-bottom:.8rem; text-align:left; display:inline-block; }
  .back-link:hover{ text-decoration:underline; }
  .timeline-list{ display:flex; flex-direction:column; gap:.6rem; margin-top:.8rem; }
  .timeline-entry{ background:#f7f1e3; border-left:3px solid var(--dourado); border-radius:6px; padding:.6rem .8rem; font-size:.88rem; }
  .timeline-date{ font-weight:bold; color:var(--mata); font-size:.8rem; margin-bottom:.2rem; }
  .pf-checkbox-group{ display:flex; flex-direction:column; gap:.5rem; font-weight:normal; }
  .pf-checkbox-row{ display:flex; align-items:center; gap:.5rem; font-weight:normal; font-size:.9rem; }
  .pf-checkbox-row input[type="checkbox"]{ width:16px; height:16px; }
  .pf-outros-input{ margin-top:.3rem; margin-left:1.6rem; width:calc(100% - 1.6rem); }
  .nao-ingerir-tags{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.3rem; }
  .nao-ingerir-tag{ background:#fdecea; color:#a4161a; border:1px solid #f3b8b0; border-radius:20px; padding:.15rem .7rem; font-size:.8rem; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(13,27,42,.6);
    display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal-box{ background:var(--branco); border:2px solid var(--dourado); border-radius:10px; padding:1.5rem; width:90%; max-width:440px; max-height:88vh; overflow-y:auto; }
  .modal-body{ display:flex; flex-direction:column; gap:.8rem; margin:1rem 0; }
  .modal-body label{ display:flex; flex-direction:column; gap:.3rem; font-size:.85rem; font-weight:bold; text-align:left; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:.6rem; }

  @media (max-width:750px){
    .app-body{ flex-direction:column; }
    .sidebar{ width:100%; }
  }
</style>
</head>
<body>

<!-- ===================== CARREGANDO ===================== -->
<div id="loadingScreen" class="login-screen">
  <div class="login-box"><p class="hint">Conectando...</p></div>
</div>

<!-- ===================== LOGIN / CADASTRO ===================== -->
<div id="loginScreen" class="login-screen hidden">
  <div class="login-box">
    <div class="login-emblem">🕯️ 🌊 🍃</div>
    <h1>Casa de Caridade e Esperança</h1>
    <p class="login-subtitle">Painel de Organização</p>

    <div class="auth-tabs">
      <button type="button" id="tabLoginBtn" class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
      <button type="button" id="tabRegisterBtn" class="auth-tab" onclick="switchAuthTab('register')">Criar conta</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>E-mail
        <input type="email" id="loginEmail" required>
      </label>
      <label>Senha
        <input type="password" id="loginPassword" required>
      </label>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <label>Seu nome
        <input type="text" id="registerName" required placeholder="Como você é chamado(a) no terreiro">
      </label>
      <label>E-mail
        <input type="email" id="registerEmail" required>
      </label>
      <label>Senha (mínimo 6 caracteres)
        <input type="password" id="registerPassword" required minlength="6">
      </label>
      <button type="submit" class="btn-primary">Criar conta</button>
    </form>

    <p id="authError" class="error hidden"></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">🕯️ Casa de Caridade e Esperança<small>Painel de Organização</small></div>
    <div class="session-info">
      <span id="sessionName"></span> · <span id="sessionRole"></span>
      <div id="notifWrap" style="position:relative;">
        <button class="notif-bell" onclick="toggleNotifDropdown()">🔔<span id="notifBadge" class="notif-badge hidden">0</span></button>
        <div id="notifDropdown" class="notif-dropdown hidden"></div>
      </div>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="app-body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- ===================== MODAL GENÉRICO ===================== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modalCancelBtn" class="btn-secondary">Cancelar</button>
      <button id="modalSaveBtn" class="btn-primary">Salvar</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   CONFIGURAÇÃO DO FIREBASE
   Cole aqui as chaves do SEU projeto Firebase
   (Firebase Console > Configurações do projeto > Seus apps > SDK setup)
   ===================================================== */
const firebaseConfig = {
   apiKey: "AIzaSyCNWVvuE8QIK1AaEd63Jo9F3JnhuoKoZ94",
   authDomain: "terreiro-b3cea.firebaseapp.com",
   projectId: "terreiro-b3cea",
   storageBucket: "terreiro-b3cea.firebasestorage.app",
   messagingSenderId: "276859338121",
   appId: "1:276859338121:web:d81c09a29b2493cdc83558",
};

/* Os dois e-mails que terão permissão de administrador (podem excluir).
   Precisam ser exatamente os e-mails usados para criar a conta no site. */
const ADMIN_EMAILS = [
  'thiagodossid@gmail.com',
  'Lucimara.oli47@gmail.com'
];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const STOCK_CATEGORIES = [
  { id:'defumacao',   name:'Defumação',                  icon:'🌿' },
  { id:'velas',       name:'Velas',                       icon:'🕯️' },
  { id:'cura',        name:'Trabalho de Cura',            icon:'💧' },
  { id:'caboclo',     name:'Trabalho de Caboclo',         icon:'🏹' },
  { id:'pretosvelhos',name:'Trabalho de Pretos Velhos',   icon:'🙏' },
  { id:'esquerda',    name:'Trabalho de Esquerda',        icon:'🔥' },
  { id:'fora',        name:'Trabalhos fora do terreiro',  icon:'🚗' },
  { id:'ere',         name:'Trabalho de Ere',             icon:'🎈' }
];

const ACTIVITY_CATEGORIES = [
  { id:'limpeza', name:'Limpeza do Terreiro', icon:'🧹' },
  { id:'bazar',   name:'Bazar',               icon:'🛍️' },
  { id:'arrecadacao', name:'Arrecadação', icon:'🎁', sub:[
      { id:'roupas',     name:'Roupas',     icon:'👕' },
      { id:'brinquedos', name:'Brinquedos', icon:'🧸' },
      { id:'outros',     name:'Outros',     icon:'📦' }
  ]}
];

/* =====================================================
   ESTADO EM MEMÓRIA (alimentado pelo Firestore em tempo real)
   ===================================================== */
let DATA = { events: [], stock: {}, activities: {}, patients: [] };
STOCK_CATEGORIES.forEach(c => { DATA.stock[c.id] = []; });
ACTIVITY_CATEGORIES.forEach(c => {
  if(c.sub) c.sub.forEach(s => { DATA.activities[s.id] = []; });
  else DATA.activities[c.id] = [];
});

let session = null;
let currentView = { type:'calendar', id:'calendario' };
let patientSearchQuery = '';
let lastSeenAt = null;
let isFirstEventsLoad = true;
let isFirstTasksLoad = true;
let unsubEvents = null, unsubStock = null, unsubTasks = null, unsubPatients = null;

function isAdminEmail(email){
  return ADMIN_EMAILS.map(e => e.toLowerCase()).includes((email || '').toLowerCase());
}
function isAdmin(){ return !!session && isAdminEmail(session.email); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function formatDateBR(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

const content = document.getElementById('content');

/* =====================================================
   AUTENTICAÇÃO
   ===================================================== */
function switchAuthTab(tab){
  document.getElementById('tabLoginBtn').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegisterBtn').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  hideAuthError();
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideAuthError(){ document.getElementById('authError').classList.add('hidden'); }

function translateAuthError(err){
  const map = {
    'auth/email-already-in-use': 'Este e-mail já está cadastrado. Tente a aba "Entrar".',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/user-not-found': 'Usuário não encontrado.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas seguidas. Aguarde um momento e tente de novo.',
    'auth/network-request-failed': 'Falha de conexão. Verifique a internet.'
  };
  return map[err.code] || ('Não foi possível concluir (' + (err.message || 'erro desconhecido') + ').');
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideAuthError();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(err){ showAuthError(translateAuthError(err)); }
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideAuthError();
  const name = document.getElementById('registerName').value.trim();
  const email = document.getElementById('registerEmail').value.trim();
  const pass = document.getElementById('registerPassword').value;
  if(!name){ showAuthError('Informe seu nome.'); return; }
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    await db.collection('users').doc(cred.user.uid).set({
      name, email,
      role: isAdminEmail(email) ? 'admin' : 'editor',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(err){ showAuthError(translateAuthError(err)); }
});

function logout(){
  if(unsubEvents) unsubEvents();
  if(unsubStock) unsubStock();
  if(unsubTasks) unsubTasks();
  if(unsubPatients) unsubPatients();
  auth.signOut();
}

auth.onAuthStateChanged(async user => {
  document.getElementById('loadingScreen').classList.add('hidden');
  if(user){
    let profile;
    try{
      const docSnap = await db.collection('users').doc(user.uid).get();
      profile = docSnap.exists ? docSnap.data() : null;
    }catch(e){ profile = null; }
    if(!profile){
      profile = { name: user.displayName || user.email, email: user.email };
      db.collection('users').doc(user.uid).set(Object.assign({}, profile, {
        role: isAdminEmail(user.email) ? 'admin' : 'editor',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })).catch(()=>{});
    }
    session = { uid: user.uid, name: profile.name || user.email, email: user.email };
    if(profile.lastSeenAt){
      lastSeenAt = profile.lastSeenAt;
    } else {
      lastSeenAt = firebase.firestore.Timestamp.now();
      db.collection('users').doc(user.uid).update({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
    }
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('sessionName').textContent = session.name;
    document.getElementById('sessionRole').textContent = isAdmin() ? 'Administrador(a)' : 'Colaborador(a)';
    buildNav();
    attachRealtimeListeners();
    updateNotifBadge();
  } else {
    session = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }
});

/* =====================================================
   LISTENERS EM TEMPO REAL (FIRESTORE)
   ===================================================== */
function attachRealtimeListeners(){
  unsubEvents = db.collection('events').onSnapshot(snap => {
    if(!isFirstEventsLoad){
      snap.docChanges().forEach(change => {
        if(change.type === 'added'){
          const e = change.doc.data();
          if(e.authorUid !== session.uid){
            notifyBrowser('📅 Novo evento no calendário', `${e.title} — ${formatDateBR(e.date)}`);
          }
        }
      });
    }
    isFirstEventsLoad = false;
    DATA.events = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    rerenderIfNeeded(['calendar']);
    updateNotifBadge();
  }, err => console.error('events listener:', err));

  unsubStock = db.collection('stockItems').onSnapshot(snap => {
    const all = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    STOCK_CATEGORIES.forEach(c => { DATA.stock[c.id] = all.filter(it => it.category === c.id); });
    rerenderIfNeeded(['stock']);
  }, err => console.error('stock listener:', err));

  unsubTasks = db.collection('activityTasks').onSnapshot(snap => {
    if(!isFirstTasksLoad){
      snap.docChanges().forEach(change => {
        if(change.type === 'added'){
          const t = change.doc.data();
          if(t.date && t.authorUid !== session.uid){
            const catLabel = findActivityCat(t.category).name;
            notifyBrowser('📅 Atividade agendada', `${t.title} (${catLabel}) — ${formatDateBR(t.date)}`);
          }
        }
      });
    }
    isFirstTasksLoad = false;
    const all = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    Object.keys(DATA.activities).forEach(catId => { DATA.activities[catId] = all.filter(t => t.category === catId); });
    rerenderIfNeeded(['activity','calendar']);
    updateNotifBadge();
  }, err => console.error('tasks listener:', err));

  unsubPatients = db.collection('curaPatients').onSnapshot(snap => {
    DATA.patients = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
    rerenderIfNeeded(['patients','patientDetail']);
  }, err => console.error('patients listener:', err));
}
function notifyBrowser(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, { body }); }catch(e){}
  }
}

function rerenderIfNeeded(types){
  if(!types.includes(currentView.type)) return;
  if(currentView.type === 'calendar') renderCalendar();
  else if(currentView.type === 'stock') renderStock(currentView.id);
  else if(currentView.type === 'activity') renderActivities(currentView.id);
  else if(currentView.type === 'patients') renderPatients();
  else if(currentView.type === 'patientDetail') renderPatientDetail(currentView.id);
}

/* =====================================================
   NOTIFICAÇÕES (sino + navegador)
   ===================================================== */
function getNotifItems(){
  const items = [];
  DATA.events.forEach(e => {
    if(e.authorUid === session.uid) return;
    if(e.createdAt && (!lastSeenAt || e.createdAt.toMillis() > lastSeenAt.toMillis())){
      items.push({ label: `📅 Evento: ${e.title}`, date: e.date, when: e.createdAt });
    }
  });
  Object.keys(DATA.activities).forEach(catId => {
    DATA.activities[catId].forEach(t => {
      if(!t.date) return;
      if(t.authorUid === session.uid) return;
      if(t.updatedAt && (!lastSeenAt || t.updatedAt.toMillis() > lastSeenAt.toMillis())){
        const catLabel = findActivityCat(catId).name;
        items.push({ label: `🤝 ${catLabel}: ${t.title}`, date: t.date, when: t.updatedAt });
      }
    });
  });
  items.sort((a,b) => (b.when ? b.when.toMillis() : 0) - (a.when ? a.when.toMillis() : 0));
  return items;
}
function updateNotifBadge(){
  if(!session) return;
  const badge = document.getElementById('notifBadge');
  if(!badge) return;
  const count = getNotifItems().length;
  if(count > 0){
    badge.textContent = count > 9 ? '9+' : String(count);
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}
function toggleNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  if(dd.classList.contains('hidden')){
    renderNotifDropdown();
    dd.classList.remove('hidden');
  } else {
    dd.classList.add('hidden');
  }
}
function renderNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  const items = getNotifItems();
  dd.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:.5rem .7rem; border-bottom:1px solid #eee;">
      <strong style="color:var(--mata); font-size:.88rem;">Novidades no calendário</strong>
      ${items.length ? `<button onclick="markAllNotifsRead()" style="background:none; color:var(--mata); font-size:.75rem; text-decoration:underline; padding:0;">Marcar como lido</button>` : ''}
    </div>
    ${items.length ? items.map(it => `
      <div class="notif-item">
        <div class="notif-item-title">${escapeHtml(it.label)}</div>
        ${it.date ? `<div class="hint" style="font-size:.78rem;">${formatDateBR(it.date)}</div>` : ''}
      </div>
    `).join('') : '<div class="notif-empty">Nenhuma novidade por aqui.</div>'}
  `;
}
function markAllNotifsRead(){
  lastSeenAt = firebase.firestore.Timestamp.now();
  db.collection('users').doc(session.uid).update({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
  updateNotifBadge();
  document.getElementById('notifDropdown').classList.add('hidden');
}
document.addEventListener('click', e => {
  const dd = document.getElementById('notifDropdown');
  const wrap = document.getElementById('notifWrap');
  if(dd && !dd.classList.contains('hidden') && wrap && !wrap.contains(e.target)){
    dd.classList.add('hidden');
  }
});

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalSaveBtn = document.getElementById('modalSaveBtn');
const modalCancelBtn = document.getElementById('modalCancelBtn');

function openModal(title, fields, onSave){
  modalTitle.textContent = title;
  modalBody.innerHTML = fields.map(f => `
    <label>${escapeHtml(f.label)}
      ${f.type === 'textarea'
        ? `<textarea data-key="${f.key}">${escapeHtml(f.value)}</textarea>`
        : `<input type="${f.type || 'text'}" data-key="${f.key}" value="${escapeHtml(f.value)}">`}
    </label>
  `).join('');
  modalOverlay.classList.remove('hidden');
  modalSaveBtn.onclick = () => {
    const values = {};
    modalBody.querySelectorAll('[data-key]').forEach(el => values[el.dataset.key] = el.value);
    onSave(values);
    closeModal();
  };
}
function closeModal(){ modalOverlay.classList.add('hidden'); }
modalCancelBtn.onclick = closeModal;

function buildNav(){
  const structure = [
    { id:'calendario', label:'Calendário', icon:'📅', type:'calendar' },
    { id:'estoque-group', label:'Estoque', icon:'📦', children: STOCK_CATEGORIES.map(c=>({id:c.id,label:c.name,icon:c.icon,type:'stock'})) },
    { id:'atividades-group', label:'Atividades', icon:'🤝', children: ACTIVITY_CATEGORIES.map(c =>
        c.sub
          ? { id:c.id+'-group', label:c.name, icon:c.icon, children: c.sub.map(s=>({id:s.id,label:s.name,icon:s.icon,type:'activity'})) }
          : { id:c.id, label:c.name, icon:c.icon, type:'activity' }
      )

function renderNavItems(items){
  return items.map(item => {
    if(item.children){
      return `<li class="nav-group">
        <div class="nav-parent" onclick="toggleGroup('${item.id}')">
          <span>${item.icon} ${escapeHtml(item.label)}</span>
          <span class="chevron" id="chev-${item.id}">▸</span>
        </div>
        <ul class="nav-children hidden" id="group-${item.id}">${renderNavItems(item.children)}</ul>
      </li>`;
    }
    return `<li><button class="nav-link" data-id="${item.id}" onclick="navigateTo('${item.type}','${item.id}')">${item.icon} ${escapeHtml(item.label)}</button></li>`;
  }).join('');

function toggleGroup(id){
  document.getElementById('group-'+id).classList.toggle('hidden');
  const chev = document.getElementById('chev-'+id);
  if(chev) chev.classList.toggle('open');
}
function setActiveNav(id){
  document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.dataset.id === id));
}
function navigateTo(type, id){
  currentView = { type, id };
  if(type === 'calendar') renderCalendar();
  else if(type === 'stock') renderStock(id);
  else if(type === 'activity') renderActivities(id);
  else if(type === 'patients') renderPatients();
}

/* =====================================================
   CALENDÁRIO
   ===================================================== */
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let calState = { month: new Date().getMonth(), year: new Date().getFullYear(), selectedDate: todayStr() };

function getScheduledTasksForDate(dateStr){
  const results = [];
  Object.keys(DATA.activities).forEach(catId => {
    DATA.activities[catId].forEach(t => {
      if(t.date === dateStr) results.push(Object.assign({ catId }, t));
    });
  });
  return results;
}

function renderCalendar(){
  setActiveNav('calendario');
  const first = new Date(calState.year, calState.month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(calState.year, calState.month+1, 0).getDate();
  const MAX_CHIPS = 3;
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calState.year}-${String(calState.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = DATA.events.filter(e => e.date === dateStr);
    const dayTasks = getScheduledTasksForDate(dateStr);

    const visibleEvents = dayEvents.slice(0, MAX_CHIPS);
    const extraEvents = dayEvents.length - visibleEvents.length;
    const chipsHtml = visibleEvents.map(e => `<span class="cal-chip chip-event" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</span>`).join('');

    const dotsHtml = dayTasks.map(t => `<span class="cal-task-dot" title="${escapeHtml(t.title)}"></span>`).join('');

    cells += `<div class="cal-cell ${calState.selectedDate===dateStr?'selected':''} ${dateStr===todayStr()?'today':''}" onclick="selectDay('${dateStr}')">
      <span class="cal-day-num">${d}</span>
      <div class="cal-item-list">
        ${chipsHtml}
        ${extraEvents > 0 ? `<span class="cal-chip-more">+${extraEvents} mais</span>` : ''}
      </div>
      ${dotsHtml ? `<div class="cal-task-dots">${dotsHtml}</div>` : ''}
    </div>`;
  }
  content.innerHTML = `
    <div class="view-header"><h2>📅 Calendário</h2></div>
    <div class="cal-controls">
      <button onclick="changeMonth(-1)">‹ Anterior</button>
      <strong>${MONTH_NAMES[calState.month]} de ${calState.year}</strong>
      <button onclick="changeMonth(1)">Próximo ›</button>
    </div>
    <div class="cal-legend">
      <span><span class="legend-swatch" style="background:var(--mata)"></span> Evento do calendário (texto no dia)</span>
      <span><span class="legend-dot"></span> Atividade/trabalho agendado (veja abaixo)</span>
    </div>
    <div class="cal-grid cal-weekdays">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-events-panel">${renderDayEvents()}</div>
  `;
}
function renderDayEvents(){
  const evs = DATA.events.filter(e => e.date === calState.selectedDate);
  const tasks = getScheduledTasksForDate(calState.selectedDate);
  return `
    <h3>Eventos em ${formatDateBR(calState.selectedDate)}</h3>
    <div class="card-list">
      ${evs.map(e => `
        <div class="card">
          <div class="card-header"><strong>${escapeHtml(e.title)}</strong>
            <span class="card-actions">
              <button onclick="editEvent('${e.id}')">✏️</button>
              ${isAdmin() ? `<button onclick="deleteEvent('${e.id}')">🗑️</button>` : ''}
            </span>
          </div>
          <p>${escapeHtml(e.desc)}</p>
          <small>Criado por ${escapeHtml(e.authorName)}</small>
        </div>`).join('') || '<p class="hint">Nenhum evento neste dia.</p>'}
    </div>
    ${tasks.length ? `
      <h3>Atividades agendadas</h3>
      <div class="card-list">
        ${tasks.map(t => {
          const cat = findActivityCat(t.catId);
          return `
          <div class="card">
            <div class="card-header"><strong>${cat.icon} ${escapeHtml(t.title)}</strong></div>
            <p class="hint">${escapeHtml(cat.name)}</p>
            <p>${escapeHtml(t.desc)}</p>
            <p class="volunteers"><strong>Voluntários:</strong> ${t.volunteers && t.volunteers.length ? t.volunteers.map(escapeHtml).join(', ') : 'Nenhum ainda'}</p>
            ${t.needsHelp ? '<span class="badge-help">🙋 Precisa de mais gente!</span>' : ''}
            <div class="task-actions">
              <button onclick="navigateTo('activity','${t.catId}')">Ver atividade</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    ` : ''}
    <button class="btn-primary" onclick="addEvent()">+ Novo evento neste dia</button>
  `;
}
function selectDay(dateStr){ calState.selectedDate = dateStr; renderCalendar(); }
function changeMonth(delta){
  calState.month += delta;
  if(calState.month < 0){ calState.month = 11; calState.year--; }
  if(calState.month > 11){ calState.month = 0; calState.year++; }
  renderCalendar();
}
function addEvent(){
  openModal('Novo evento', [
    { key:'title', label:'Título', value:'' },
    { key:'desc', label:'Descrição', type:'textarea', value:'' }
  ], async vals => {
    if(!vals.title.trim()) return;
    try{
      await db.collection('events').add({
        date: calState.selectedDate,
        title: vals.title.trim(),
        desc: vals.desc.trim(),
        authorName: session.name,
        authorUid: session.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(err){ alert('Não foi possível salvar: ' + err.message); }
  });
}
function editEvent(id){
  const ev = DATA.events.find(e => e.id === id);
  openModal('Editar evento', [
    { key:'title', label:'Título', value:ev.title },
    { key:'desc', label:'Descrição', type:'textarea', value:ev.desc }
  ], async vals => {
    try{
      await db.collection('events').doc(id).update({ title: vals.title.trim(), desc: vals.desc.trim() });
    }catch(err){ alert('Não foi possível salvar: ' + err.message); }
  });
}
function deleteEvent(id){
  if(!isAdmin()) return;
  if(!confirm('Excluir este evento?')) return;
  db.collection('events').doc(id).delete().catch(err => alert('Não foi possível excluir: ' + err.message));
}

function findActivityCat(id){
  for(const c of ACTIVITY_CATEGORIES){
    if(c.id === id) return c;
    if(c.sub){ const s = c.sub.find(s => s.id === id); if(s) return s; }
  }
  return { name:'', icon:'' };
}
function renderActivities(catId){
  setActiveNav(catId);
  const cat = findActivityCat(catId);
  const tasks = DATA.activities[catId];
  content.innerHTML = `
    <div class="view-header"><h2>${cat.icon} ${escapeHtml(cat.name)}</h2></div>
    <div class="card-list">
      ${tasks.length ? tasks.map(t => renderTaskCard(catId, t)).join('') : '<p class="hint">Nenhuma atividade cadastrada ainda.</p>'}
    </div>
    <button class="btn-primary" onclick="addTask('${catId}')">+ Nova atividade</button>
  `;

function renderTaskCard(catId, t){

        <span class="card-actions">

}

      ${patients.length ? patients.map(p => renderPatientCard(p)).join('') : '<p class="hint">Nenhum paciente encontrado.</p>'}
    </div>
    <button class="btn-primary" onclick="addPatient()">+ Nova ficha de paciente</button>
  `;
  const searchInput = document.getElementById('patientSearchInput');
  searchInput.addEventListener('input', e => {
    patientSearchQuery = e.target.value;
    const cursorPos = e.target.selectionStart;
    renderPatients();
    const newInput = document.getElementById('patientSearchInput');
    newInput.focus();
    newInput.setSelectionRange(cursorPos, cursorPos);
  });
}
function renderPatientCard(p){
  return `
    <div class="card">
      <div class="card-header">
        <strong>${escapeHtml(p.nome)}</strong>
        <span class="card-actions">
          <button onclick="editPatient('${p.id}')">✏️</button>
          ${isAdmin() ? `<button onclick="deletePatient('${p.id}')">🗑️</button>` : ''}
        </span>
      </div>
      ${p.telefone ? `<p><span class="patient-field-label">Telefone</span><br>${escapeHtml(p.telefone)}</p>` : ''}
      <div class="task-actions">
        <button onclick="navigateToPatientDetail('${p.id}')">📋 Ver ficha completa</button>
      </div>
    </div>
  `;
}
function openPatientFormModal(title, existing, onSave){
  const ni = (existing && existing.naoIngerir) || {};
  modalTitle.textContent = title;
  modalBody.innerHTML = `
    <label>Nome
      <input type="text" id="pf-nome" value="${escapeHtml(existing ? existing.nome : '')}">
    </label>
    <label>Telefone
      <input type="text" id="pf-telefone" value="${escapeHtml(existing ? (existing.telefone || '') : '')}">
    </label>
    <label>Repouso
      <input type="text" id="pf-repouso" value="${escapeHtml(existing ? (existing.repouso || '') : '')}">
    </label>
    <label>Não ingerir
      <span class="pf-checkbox-group">
        <span class="pf-checkbox-row"><input type="checkbox" id="pf-acucar" ${ni.acucar ? 'checked' : ''}> Açúcar</span>
        <span class="pf-checkbox-row"><input type="checkbox" id="pf-farinha" ${ni.farinha ? 'checked' : ''}> Farinha</span>
        <span class="pf-checkbox-row"><input type="checkbox" id="pf-cafe" ${ni.cafe ? 'checked' : ''}> Café</span>
        <span>
          <span class="pf-checkbox-row"><input type="checkbox" id="pf-outros" ${ni.outros ? 'checked' : ''}> Outros</span>
          <input type="text" id="pf-outrosTexto" class="pf-outros-input" placeholder="especifique" value="${escapeHtml(ni.outrosTexto || '')}">
        </span>
      </span>
    </label>
    <label>Vidros
      <input type="text" id="pf-vidros" value="${escapeHtml(existing ? (existing.vidros || '') : '')}">
    </label>
    <label>Vezes
      <input type="text" id="pf-vezes" value="${escapeHtml(existing ? (existing.vezes || '') : '')}">
    </label>
    <label>+Cirurgias
      <textarea id="pf-cirurgias">${escapeHtml(existing ? (existing.cirurgias || '') : '')}</textarea>
    </label>
    <label>Observações
      <textarea id="pf-observacoes">${escapeHtml(existing ? (existing.observacoes || '') : '')}</textarea>
    </label>
  `;
  modalOverlay.classList.remove('hidden');
  modalSaveBtn.onclick = () => {
    const nome = document.getElementById('pf-nome').value.trim();
    if(!nome) return;
    const vals = {
      nome,
      telefone: document.getElementById('pf-telefone').value.trim(),
      repouso: document.getElementById('pf-repouso').value.trim(),
      naoIngerir: {
        acucar: document.getElementById('pf-acucar').checked,
        farinha: document.getElementById('pf-farinha').checked,
        cafe: document.getElementById('pf-cafe').checked,
        outros: document.getElementById('pf-outros').checked,
        outrosTexto: document.getElementById('pf-outrosTexto').value.trim()
      },
      vidros: document.getElementById('pf-vidros').value.trim(),
      vezes: document.getElementById('pf-vezes').value.trim(),
      cirurgias: document.getElementById('pf-cirurgias').value.trim(),
      observacoes: document.getElementById('pf-observacoes').value.trim()
    };
    onSave(vals);
    closeModal();
  };
}
function addPatient(){
  openPatientFormModal('Nova ficha de paciente', null, async vals => {
    try{
      await db.collection('curaPatients').add(Object.assign({}, vals, {
        history: [],
        createdBy: session.name,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }));
    }catch(err){ alert('Não foi possível salvar: ' + err.message); }
  });
}
function editPatient(id){
  const p = DATA.patients.find(x => x.id === id);
  openPatientFormModal('Editar ficha de paciente', p, async vals => {
    try{
      await db.collection('curaPatients').doc(id).update(vals);
    }catch(err){ alert('Não foi possível salvar: ' + err.message); }
  });
}
function deletePatient(id){
  if(!isAdmin()) return;
  if(!confirm('Excluir esta ficha de paciente? Todo o histórico de atendimentos será perdido.')) return;
  db.collection('curaPatients').doc(id).delete().catch(err => alert('Não foi possível excluir: ' + err.message));
}
function navigateToPatientDetail(id){
  currentView = { type:'patientDetail', id };
  renderPatientDetail(id);
}
function renderPatientDetail(id){
  setActiveNav('pacientes');
  const p = DATA.patients.find(x => x.id === id);
  if(!p){
    content.innerHTML = `
      <button class="back-link" onclick="navigateTo('patients','pacientes')">← Voltar para lista de pacientes</button>
      <p class="hint">Ficha não encontrada.</p>
    `;
    return;
  }
  const ni = p.naoIngerir || {};
  const naoIngerirTags = [];
  if(ni.acucar) naoIngerirTags.push('Açúcar');
  if(ni.farinha) naoIngerirTags.push('Farinha');
  if(ni.cafe) naoIngerirTags.push('Café');
  if(ni.outros) naoIngerirTags.push(ni.outrosTexto ? `Outros: ${ni.outrosTexto}` : 'Outros');

  const history = (p.history || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  content.innerHTML = `
    <button class="back-link" onclick="navigateTo('patients','pacientes')">← Voltar para lista de pacientes</button>
    <div class="view-header"><h2>🩺 Ficha de ${escapeHtml(p.nome)}</h2></div>
    <div class="card">
      <div class="patient-summary-grid">
        ${p.telefone ? `<span><span class="patient-field-label">Telefone</span><br>${escapeHtml(p.telefone)}</span>` : ''}
        ${p.repouso ? `<span><span class="patient-field-label">Repouso</span><br>${escapeHtml(p.repouso)}</span>` : ''}
        ${p.vidros ? `<span><span class="patient-field-label">Vidros</span><br>${escapeHtml(p.vidros)}</span>` : ''}
        ${p.vezes ? `<span><span class="patient-field-label">Vezes</span><br>${escapeHtml(p.vezes)}</span>` : ''}
      </div>
      ${naoIngerirTags.length ? `
        <p class="patient-field-label">Não ingerir</p>
        <div class="nao-ingerir-tags">${naoIngerirTags.map(t => `<span class="nao-ingerir-tag">${escapeHtml(t)}</span>`).join('')}</div>
      ` : ''}
      ${p.cirurgias ? `<p><span class="patient-field-label">Cirurgias</span><br>${escapeHtml(p.cirurgias)}</p>` : ''}
      ${p.observacoes ? `<p><span class="patient-field-label">Observações</span><br>${escapeHtml(p.observacoes)}</p>` : ''}
      <div class="task-actions">
        <button onclick="editPatient('${p.id}')">✏️ Editar dados</button>
        ${isAdmin() ? `<button onclick="deletePatient('${p.id}')">🗑️ Excluir ficha</button>` : ''}
      </div>
    </div>

    <h3 style="margin-top:1.5rem">Histórico de atendimentos</h3>
    <div class="timeline-list">
      ${history.length ? history.map(h => `
        <div class="timeline-entry">
          <div class="timeline-date">${h.date ? formatDateBR(h.date) : ''}</div>
          <div>${escapeHtml(h.note)}</div>
          <small class="hint">Registrado por ${escapeHtml(h.author)}</small>
        </div>
      `).join('') : '<p class="hint">Nenhum atendimento registrado ainda.</p>'}
    </div>
    <button class="btn-primary" style="margin-top:1rem" onclick="addPatientEntry('${p.id}')">+ Registrar atendimento/orientação</button>
  `;
}
function addPatientEntry(patientId){
  openModal('Registrar atendimento', [
    { key:'date', label:'Data do atendimento', type:'date', value: todayStr() },
    { key:'note', label:'Orientações / observações deste atendimento', type:'textarea', value:'' }
  ], async vals => {
    if(!vals.note.trim()) return;
    try{
      await db.collection('curaPatients').doc(patientId).update({
        history: firebase.firestore.FieldValue.arrayUnion({
          date: vals.date || todayStr(),
          note: vals.note.trim(),
          author: session.name
        })
      });
    }catch(err){ alert('Não foi possível salvar: ' + err.message); }
  });
}
</script>
</body>
</html>
